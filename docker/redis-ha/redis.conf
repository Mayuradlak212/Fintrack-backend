# Shared by the primary and both replicas.
#
# One file rather than three, because a replica must be configured exactly like
# a primary: after a failover it *becomes* the primary, and any safety setting
# that only existed on the old primary would quietly disappear at the worst
# possible moment. Per-node differences (port, replicaof, announced address)
# are passed as command-line overrides in docker-compose.yml.

bind 0.0.0.0
protected-mode no
dir /data

# ── Persistence ──────────────────────────────────────────────────────────────
# AOF with everysec: a primary that crashes loses at most a second of writes
# locally. Replication covers the case where the whole node never comes back.
appendonly yes
appendfsync everysec

# ── Replication safety ───────────────────────────────────────────────────────
# The primary refuses writes unless at least this many replicas are connected
# and lagging no more than min-replicas-max-lag seconds. Clients get
# "NOREPLICAS Not enough good replicas to write."
#
# This is the half of the guarantee that WAIT cannot provide: WAIT tells you
# after the fact that a write was not replicated, while this stops the write
# from being accepted at all. A rejected write is a visible error; an accepted
# write that only ever existed on a dead primary is silent data loss.
#
# 1 of 2 replicas is the right setting here. Requiring 2 would mean a single
# replica restart takes writes down - trading availability for a durability
# margin that the second replica barely adds.
min-replicas-to-write 1
min-replicas-max-lag 10

# Replicas must never accept writes of their own; split-brain writes to a
# demoted node are exactly what Sentinel cannot repair.
replica-read-only yes

# Keep serving reads while syncing. The alternative (replica-serve-stale-data
# no) turns every resync into a read outage on that node.
replica-serve-stale-data yes

# Diskless sync avoids a full RDB write to disk on every replica handshake.
repl-diskless-sync yes
repl-diskless-sync-delay 0

# How often replicas ping the primary. This drives the `lag` field that
# min-replicas-max-lag is measured against.
repl-ping-replica-period 1

# ── Buffers ──────────────────────────────────────────────────────────────────
# A replica that falls behind by more than the output buffer gets disconnected
# and must do a full resync. The defaults are small for a write-heavy primary.
client-output-buffer-limit replica 256mb 64mb 60

# Backlog held for replicas that disconnect briefly, so a blip is a partial
# resync instead of a full one.
repl-backlog-size 64mb
repl-backlog-ttl 3600

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
