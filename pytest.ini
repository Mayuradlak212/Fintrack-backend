[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: needs the docker/redis-ha stack running (see REDIS_HA.md)
    failover: kills or blocks Redis nodes - destructive and slow, opt in with -m failover
# Failover drills take a node down for ~30s each, so they are opt-in rather
# than part of a default run. Pass -m failover to include them (a later -m on
# the command line overrides this one).
addopts = -m "not failover"
